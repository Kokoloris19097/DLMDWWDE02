# Ingestion API Deployment
{{- if .Values.ingestionApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: {{ .Values.namespaces.api }}
  labels:
    app: ingestion-api
    component: api
spec:
  replicas: {{ .Values.ingestionApi.replicaCount }}
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
        component: api
    spec:
      containers:
        - name: ingestion-api
          image: "{{ .Values.ingestionApi.image.repository }}:{{ .Values.ingestionApi.image.tag }}"
          imagePullPolicy: {{ .Values.ingestionApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ingestionApi.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.ingestionApi.resources | nindent 12 }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: PORT
              value: "{{ .Values.ingestionApi.service.port }}"
{{- end }}
---
# Reporting API Deployment
{{- if .Values.reportingApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-api
  namespace: {{ .Values.namespaces.api }}
  labels:
    app: reporting-api
    component: api
spec:
  replicas: {{ .Values.reportingApi.replicaCount }}
  selector:
    matchLabels:
      app: reporting-api
  template:
    metadata:
      labels:
        app: reporting-api
        component: api
    spec:
      containers:
        - name: reporting-api
          image: "{{ .Values.reportingApi.image.repository }}:{{ .Values.reportingApi.image.tag }}"
          imagePullPolicy: {{ .Values.reportingApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.reportingApi.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.reportingApi.resources | nindent 12 }}
          env:
            - name: CLICKHOUSE_HOST
              value: "clickhouse"
            - name: REDIS_HOST
              value: "redis"
            - name: PORT
              value: "{{ .Values.reportingApi.service.port }}"
{{- end }}
---
# Data Processor Deployment
{{- if .Values.dataProcessor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processor
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: data-processor
    component: processing
spec:
  replicas: {{ .Values.dataProcessor.replicaCount }}
  selector:
    matchLabels:
      app: data-processor
  template:
    metadata:
      labels:
        app: data-processor
        component: processing
    spec:
      containers:
        - name: data-processor
          image: "{{ .Values.dataProcessor.image.repository }}:{{ .Values.dataProcessor.image.tag }}"
          imagePullPolicy: {{ .Values.dataProcessor.image.pullPolicy }}
          resources:
            {{- toYaml .Values.dataProcessor.resources | nindent 12 }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPARK_MASTER
              value: "spark://spark-master:7077"
{{- end }}

{{- if .Values.ingestionApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: {{ .Values.namespaces.api }}
  labels:
    app: ingestion-api
spec:
  replicas: {{ .Values.ingestionApi.replicaCount }}
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
      - name: ingestion-api
        image: "{{ .Values.ingestionApi.image.repository }}:{{ .Values.ingestionApi.image.tag }}"
        imagePullPolicy: {{ .Values.ingestionApi.image.pullPolicy }}
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        resources:
          {{- toYaml .Values.ingestionApi.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api-service
  namespace: {{ .Values.namespaces.api }}
  labels:
    app: ingestion-api
spec:
  selector:
    app: ingestion-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
{{- end }}

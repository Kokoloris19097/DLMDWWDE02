# Ingestion API Service
{{- if .Values.ingestionApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api-service
  namespace: {{ .Values.namespaces.api }}
  labels:
    app: ingestion-api
spec:
  type: {{ .Values.ingestionApi.service.type }}
  ports:
    - port: {{ .Values.ingestionApi.service.port }}
      targetPort: {{ .Values.ingestionApi.service.port }}
      protocol: TCP
      name: http
  selector:
    app: ingestion-api
{{- end }}
---
# Reporting API Service
{{- if .Values.reportingApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: reporting-api-service
  namespace: {{ .Values.namespaces.api }}
  labels:
    app: reporting-api
spec:
  type: {{ .Values.reportingApi.service.type }}
  ports:
    - port: {{ .Values.reportingApi.service.port }}
      targetPort: {{ .Values.reportingApi.service.port }}
      protocol: TCP
      name: http
  selector:
    app: reporting-api
{{- end }}
---
# Data Processor Service (Internal)
{{- if .Values.dataProcessor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: data-processor-service
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: data-processor
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
  selector:
    app: data-processor
{{- end }}

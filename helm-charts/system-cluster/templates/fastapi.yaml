---
# FastAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: {{ .Values.fastapi.namespace }}
  labels:
    app: fastapi
    component: api
spec:
  replicas: {{ .Values.fastapi.replicaCount }}
  selector:
    matchLabels:
      app: fastapi
      component: api
  template:
    metadata:
      labels:
        app: fastapi
        component: api
    spec:
      containers:
      - name: fastapi
        image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}"
        imagePullPolicy: {{ .Values.fastapi.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.fastapi.env.kafkaBootstrapServers | quote }}
        - name: KAFKA_TOPIC
          value: {{ .Values.fastapi.env.kafkaTopic | quote }}
        - name: SERVICE_NAME
          value: "fastapi"
        resources:
          limits:
            cpu: {{ .Values.fastapi.resources.limits.cpu }}
            memory: {{ .Values.fastapi.resources.limits.memory }}
          requests:
            cpu: {{ .Values.fastapi.resources.requests.cpu }}
            memory: {{ .Values.fastapi.resources.requests.memory }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
# FastAPI Service
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: {{ .Values.fastapi.namespace }}
  labels:
    app: fastapi
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: fastapi
    component: api

---
# FastAPI Ingress (HTTPS Endpoint)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi
  namespace: {{ .Values.fastapi.namespace }}
  labels:
    app: fastapi
    component: api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.fastapi.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fastapi
            port:
              number: 8000
  {{- if .Values.fastapi.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.fastapi.ingress.host }}
    secretName: {{ .Values.fastapi.ingress.tls.secretName }}
  {{- end }}

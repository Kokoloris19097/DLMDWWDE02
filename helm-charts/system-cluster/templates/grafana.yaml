---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.{{ .Values.prometheus.namespace }}.svc.cluster.local:{{ .Values.prometheus.service.port }}
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "15s"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
    grafana_dashboard: "1"
data:
  cluster-overview.json: |
    {
      "dashboard": {
        "title": "Cluster Resources Overview",
        "timezone": "browser",
        "schemaVersion": 16,
        "refresh": "30s",
        "tags": ["kubernetes", "cluster", "overview"],
        "panels": [
          {
            "id": 1,
            "title": "Total Cluster CPU Usage",
            "type": "stat",
            "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 2, "color": "yellow"},
                    {"value": 4, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value"
            }
          },
          {
            "id": 2,
            "title": "Total Cluster Memory (GB)",
            "type": "stat",
            "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes{container!=\"\"}) / 1024 / 1024 / 1024",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "decgbytes",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 8, "color": "yellow"},
                    {"value": 16, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area"
            }
          },
          {
            "id": 3,
            "title": "Total Pods",
            "type": "stat",
            "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "count(container_last_seen{container!=\"\"})",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none"
            }
          },
          {
            "id": 4,
            "title": "Total Network Traffic (MB/s)",
            "type": "stat",
            "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "sum(rate(container_network_receive_bytes_total[5m]) + rate(container_network_transmit_bytes_total[5m])) / 1024 / 1024",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "MBs"
              }
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area"
            }
          },
          {
            "id": 5,
            "title": "CPU Usage by Namespace",
            "type": "timeseries",
            "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "palette-classic"}
              }
            }
          },
          {
            "id": 6,
            "title": "Memory Usage by Namespace",
            "type": "timeseries",
            "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes{container!=\"\"}) by (namespace) / 1024 / 1024 / 1024",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "decgbytes",
                "color": {"mode": "palette-classic"}
              }
            }
          },
          {
            "id": 7,
            "title": "Network Traffic by Namespace",
            "type": "timeseries",
            "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_network_receive_bytes_total[5m]) + rate(container_network_transmit_bytes_total[5m])) by (namespace) / 1024 / 1024",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "MBs"
              }
            }
          },
          {
            "id": 8,
            "title": "Disk I/O by Namespace",
            "type": "timeseries",
            "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_fs_reads_bytes_total[5m]) + rate(container_fs_writes_bytes_total[5m])) by (namespace) / 1024 / 1024",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "MBs"
              }
            }
          },
          {
            "id": 9,
            "title": "Resource Distribution",
            "type": "piechart",
            "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "right", "values": ["value", "percent"]}
            }
          },
          {
            "id": 10,
            "title": "Top 10 CPU Consumers",
            "type": "table",
            "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "topk(10, sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (pod, namespace))",
                "refId": "A",
                "format": "table",
                "instant": true
              }
            ],
            "transformations": [
              {"id": "organize", "options": {"excludeByName": {"Time": true}}}
            ]
          }
        ]
      }
    }


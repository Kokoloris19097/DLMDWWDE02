---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.{{ .Values.prometheus.namespace }}.svc.cluster.local:{{ .Values.prometheus.service.port }}
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "15s"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-resources
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
data:
  resources-overview.json: |
    {
      "dashboard": {
        "title": "Kubernetes Resources Overview",
        "timezone": "browser",
        "schemaVersion": 16,
        "refresh": "30s",
        "tags": ["kubernetes", "resources"],
        "panels": [
          {
            "id": 1,
            "title": "CPU Usage by Pod",
            "type": "timeseries",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (pod, namespace)",
                "legendFormat": "{{ `{{namespace}}/{{pod}}` }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "palette-classic"}
              }
            }
          },
          {
            "id": 2,
            "title": "Memory Usage by Pod",
            "type": "timeseries",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes{container!=\"\"}) by (pod, namespace) / 1024 / 1024",
                "legendFormat": "{{ `{{namespace}}/{{pod}}` }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "decmbytes",
                "color": {"mode": "palette-classic"}
              }
            }
          },
          {
            "id": 3,
            "title": "Network Traffic by Pod",
            "type": "timeseries",
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_network_receive_bytes_total{container!=\"\")}[5m])) by (pod) / 1024 / 1024",
                "legendFormat": "{{ `{{pod}} RX` }}",
                "refId": "A"
              },
              {
                "expr": "sum(rate(container_network_transmit_bytes_total{container!=\"\")}[5m])) by (pod) / 1024 / 1024",
                "legendFormat": "{{ `{{pod}} TX` }}",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "MBs",
                "color": {"mode": "palette-classic"}
              }
            }
          },
          {
            "id": 4,
            "title": "Disk I/O by Pod",
            "type": "timeseries",
            "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_fs_reads_bytes_total{container!=\"\")}[5m])) by (pod) / 1024 / 1024",
                "legendFormat": "{{ `{{pod}} Read` }}",
                "refId": "A"
              },
              {
                "expr": "sum(rate(container_fs_writes_bytes_total{container!=\"\")}[5m])) by (pod) / 1024 / 1024",
                "legendFormat": "{{ `{{pod}} Write` }}",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "MBs",
                "color": {"mode": "palette-classic"}
              }
            }
          },
          {
            "id": 5,
            "title": "CPU by Namespace",
            "type": "piechart",
            "gridPos": {"x": 0, "y": 16, "w": 8, "h": 8},
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\")}[5m])) by (namespace)",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "right"}
            }
          },
          {
            "id": 6,
            "title": "Memory by Namespace",
            "type": "piechart",
            "gridPos": {"x": 8, "y": 16, "w": 8, "h": 8},
            "targets": [
              {
                "expr": "sum(container_memory_usage_bytes{container!=\"\"}) by (namespace) / 1024 / 1024 / 1024",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "right"}
            },
            "fieldConfig": {
              "defaults": {
                "unit": "decgbytes"
              }
            }
          },
          {
            "id": 7,
            "title": "Pod Count by Namespace",
            "type": "stat",
            "gridPos": {"x": 16, "y": 16, "w": 8, "h": 8},
            "targets": [
              {
                "expr": "count(container_last_seen{container!=\"\"}) by (namespace)",
                "legendFormat": "{{ `{{namespace}}` }}",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "value_and_name"
            }
          }
        ]
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      component: monitoring
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
        imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.grafana.adminUser }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.grafana.adminPassword }}
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_INSTALL_PLUGINS
          value: ""
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: {{ .Values.grafana.resources.requests.cpu }}
            memory: {{ .Values.grafana.resources.requests.memory }}
          limits:
            cpu: {{ .Values.grafana.resources.limits.cpu }}
            memory: {{ .Values.grafana.resources.limits.memory }}
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: dashboards
        configMap:
          name: grafana-dashboard-resources

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.grafana.storage.size }}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.grafana.namespace }}
  labels:
    app: grafana
    component: monitoring
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
  - port: {{ .Values.grafana.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: grafana
    component: monitoring

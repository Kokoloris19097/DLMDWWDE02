---
# JMX Exporter Configuration for Kafka
# This configuration extracts JVM and Kafka-specific metrics
# and exposes them in Prometheus format

# JVM Metrics
lowercaseOutputName: true
lowercaseOutputLabelNames: true
whitelistObjectNames:
  # JVM Memory
  - "java.lang:type=Memory"
  - "java.lang:type=MemoryPool,*"
  - "java.lang:type=GarbageCollector,*"
  - "java.lang:type=Threading"
  - "java.lang:type=Runtime"
  - "java.lang:type=OperatingSystem"

  # Kafka Broker Metrics
  - "kafka.server:type=BrokerTopicMetrics,*"
  - "kafka.server:type=ReplicaManager,*"
  - "kafka.server:type=ReplicaFetcherManager,*"
  - "kafka.server:type=KafkaRequestHandlerPool,*"
  - "kafka.server:type=DelayedOperationPurgatory,*"
  - "kafka.server:type=FetcherLagMetrics,*"
  - "kafka.server:type=SessionExpireListener,*"

  # Kafka Controller Metrics
  - "kafka.controller:type=KafkaController,*"
  - "kafka.controller:type=ControllerStats,*"

  # Kafka Network Metrics
  - "kafka.network:type=RequestMetrics,*"
  - "kafka.network:type=SocketServer,*"
  - "kafka.network:type=Processor,*"

  # Kafka Log Metrics
  - "kafka.log:type=LogFlushStats,*"
  - "kafka.log:type=Log,*"
  - "kafka.log:type=LogCleaner,*"

  # Kafka Cluster Metrics
  - "kafka.cluster:type=Partition,*"

rules:
  # JVM Memory
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(\w+)'
    name: jvm_memory_heap_$1_bytes
    type: GAUGE

  - pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>(\w+)'
    name: jvm_memory_nonheap_$1_bytes
    type: GAUGE

  - pattern: 'java.lang<type=MemoryPool, name=(.+)><Usage>(\w+)'
    name: jvm_memory_pool_$2_bytes
    labels:
      pool: "$1"
    type: GAUGE

  # JVM GC
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><CollectionCount>'
    name: jvm_gc_collection_count_total
    labels:
      gc: "$1"
    type: COUNTER

  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><CollectionTime>'
    name: jvm_gc_collection_time_ms_total
    labels:
      gc: "$1"
    type: COUNTER

  # JVM Threading
  - pattern: 'java.lang<type=Threading><ThreadCount>'
    name: jvm_threads_current
    type: GAUGE

  - pattern: 'java.lang<type=Threading><DaemonThreadCount>'
    name: jvm_threads_daemon
    type: GAUGE

  # Kafka Broker Topic Metrics
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>Count'
    name: kafka_server_brokertopicmetrics_$1_total
    labels:
      topic: "$2"
    type: COUNTER

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(.+)><>Count'
    name: kafka_server_brokertopicmetrics_$1_total
    type: COUNTER

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>OneMinuteRate'
    name: kafka_server_brokertopicmetrics_$1_rate
    labels:
      topic: "$2"
    type: GAUGE

  # Kafka Request Metrics
  - pattern: 'kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.+)><>Count'
    name: kafka_network_requestmetrics_requests_total
    labels:
      request: "$1"
    type: COUNTER

  - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><>(\w+)'
    name: kafka_network_requestmetrics_total_time_ms_$2
    labels:
      request: "$1"
    type: GAUGE

  # Kafka Controller Metrics
  - pattern: 'kafka.controller<type=KafkaController, name=(.+)><>Value'
    name: kafka_controller_kafkacontroller_$1
    type: GAUGE

  - pattern: 'kafka.controller<type=ControllerStats, name=(.+)><>Count'
    name: kafka_controller_controllerstats_$1_total
    type: COUNTER

  # Kafka Replica Manager
  - pattern: 'kafka.server<type=ReplicaManager, name=(.+)><>Value'
    name: kafka_server_replicamanager_$1
    type: GAUGE

  - pattern: 'kafka.server<type=ReplicaManager, name=(.+)><>Count'
    name: kafka_server_replicamanager_$1_total
    type: COUNTER

  # Kafka Log Metrics
  - pattern: 'kafka.log<type=Log, name=(.+), topic=(.+), partition=(.+)><>Value'
    name: kafka_log_log_$1
    labels:
      topic: "$2"
      partition: "$3"
    type: GAUGE

  # Kafka Partition Metrics
  - pattern: 'kafka.cluster<type=Partition, name=(.+), topic=(.+), partition=(.+)><>Value'
    name: kafka_cluster_partition_$1
    labels:
      topic: "$2"
      partition: "$3"
    type: GAUGE

  # Catch-all for other metrics
  - pattern: '.*'

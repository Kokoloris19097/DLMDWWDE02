---
# Kafka Controller StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: controller
spec:
  serviceName: kafka-controller
  replicas: {{ .Values.kafka.controller.replicaCount }}
  selector:
    matchLabels:
      app: kafka
      component: controller
  template:
    metadata:
      labels:
        app: kafka
        component: controller
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
        ports:
        - name: controller
          containerPort: 9093
          protocol: TCP
        resources:
          {{- toYaml .Values.kafka.controller.resources | nindent 10 }}
        env:
        - name: KAFKA_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- range $key, $value := .Values.kafka.controller.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}

---
# Kontroller Kommunikations-Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: controller
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: controller
    port: 9093
    targetPort: 9093
    protocol: TCP
  selector:
    app: kafka
    component: controller

---
# Kafka Broker StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  serviceName: kafka-broker
  replicas: {{ .Values.kafka.broker.replicaCount }}
  selector:
    matchLabels:
      app: kafka
      component: broker
  template:
    metadata:
      labels:
        app: kafka
        component: broker
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
        ports:
        - name: plaintext
          containerPort: 19092
          protocol: TCP
        - name: external
          containerPort: 9092
          protocol: TCP
        resources:
          {{- toYaml .Values.kafka.broker.resources | nindent 10 }}
        env:
        - name: KAFKA_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).kafka-broker.messaging.svc.cluster.local:19092,PLAINTEXT_HOST://$(POD_NAME).kafka-broker.messaging.svc.cluster.local:9092"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- range $key, $value := .Values.kafka.broker.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}

---
# Kafka Broker Kommunikations-Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: plaintext
    port: 19092
    targetPort: 19092
    protocol: TCP
  - name: external
    port: 9092
    targetPort: 9092
    protocol: TCP
  selector:
    app: kafka
    component: broker

---
# Kafka Broker Service (für Client-Zugriff)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  type: ClusterIP
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
    protocol: TCP
  selector:
    app: kafka
    component: broker

---
# Kafka Controller StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: controller
spec:
  serviceName: kafka-controller
  replicas: {{ .Values.kafka.controller.replicaCount }}
  selector:
    matchLabels:
      app: kafka
      component: controller
  template:
    metadata:
      labels:
        app: kafka
        component: controller
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
        ports:
        - containerPort: 9093
        env:
        {{- range $key, $value := .Values.kafka.controller.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        command:
        - sh
        - -c
        - |
          # Extrahiere Node ID aus Hostname
          NODE_ID=$${HOSTNAME##*-}

          echo "=== Controller Configuration ==="
          echo "Node ID: $$NODE_ID"

          # Übergebe Werte als Argumente an run-Script
          exec /etc/kafka/docker/run KAFKA_NODE_ID=$$NODE_ID

---
# Kafka Controller Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: controller
spec:
  clusterIP: None
  ports:
  - port: 9093
  selector:
    app: kafka
    component: controller

---
# Kafka Broker StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  serviceName: kafka-broker
  replicas: {{ .Values.kafka.broker.replicaCount }}
  selector:
    matchLabels:
      app: kafka
      component: broker
  template:
    metadata:
      labels:
        app: kafka
        component: broker
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        ports:
        - containerPort: 9092
        env:
        {{- range $key, $value := .Values.kafka.broker.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - sh
        - -c
        - |
          # Berechne Node ID
          NODE_ID=$${HOSTNAME##*-}
          OFFSET={{ .Values.kafka.controller.replicaCount }}
          BROKER_ID=$$((NODE_ID + OFFSET))

          # Berechne FQDN
          FQDN="$$(hostname -f)"

          echo "=== Broker Configuration ==="
          echo "Node ID: $$BROKER_ID"
          echo "Advertised Listeners: PLAINTEXT://$$FQDN:9092"

          # Übergebe Werte als Argumente an run-Script
          exec /etc/kafka/docker/run \
            KAFKA_NODE_ID=$$BROKER_ID \
            KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://$$FQDN:9092

---
# Kafka Broker Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  clusterIP: None
  ports:
  - port: 9092
  selector:
    app: kafka
    component: broker

---
# Kafka Client Service
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  ports:
  - port: 9092
  selector:
    app: kafka
    component: broker

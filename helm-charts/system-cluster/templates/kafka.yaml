---
# Kafka Controller StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: controller
spec:
  serviceName: kafka-controller
  replicas: {{ .Values.kafka.controller.replicaCount }}
  selector:
    matchLabels:
      app: kafka
      component: controller
  template:
    metadata:
      labels:
        app: kafka
        component: controller
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
        ports:
        - containerPort: 9093
        env:
        {{- range $key, $value := .Values.kafka.controller.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        command: ["sh", "-c", "export KAFKA_NODE_ID=$${HOSTNAME##*-} && exec /etc/kafka/docker/run"]

---
# Kafka Controller Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: controller
spec:
  clusterIP: None
  ports:
  - port: 9093
  selector:
    app: kafka
    component: controller

---
# Kafka Broker StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  serviceName: kafka-broker
  replicas: {{ .Values.kafka.broker.replicaCount }}
  selector:
    matchLabels:
      app: kafka
      component: broker
  template:
    metadata:
      labels:
        app: kafka
        component: broker
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        ports:
        - containerPort: 9092
        env:
        {{- range $key, $value := .Values.kafka.broker.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        command:
        - sh
        - -c
        - |
          NODE_ID=$${HOSTNAME##*-}
          OFFSET={{ .Values.kafka.controller.replicaCount }}
          export KAFKA_NODE_ID=$$((NODE_ID + OFFSET))
          export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://$$(hostname -f):9092
          exec /etc/kafka/docker/run

---
# Kafka Broker Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  clusterIP: None
  ports:
  - port: 9092
  selector:
    app: kafka
    component: broker

---
# Kafka Client Service
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: broker
spec:
  ports:
  - port: 9092
  selector:
    app: kafka
    component: broker

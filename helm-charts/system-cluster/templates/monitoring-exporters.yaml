---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jmx-exporter-config
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    component: jmx-exporter
data:
  jmx-exporter-config.yaml: |
{{ .Files.Get "templates/jmx-exporter-config.yaml" | indent 4 }}

---
# PostgreSQL Exporter Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: {{ .Values.postgresql.namespace }}
  labels:
    app: postgres-exporter
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
      component: monitoring
  template:
    metadata:
      labels:
        app: postgres-exporter
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.15.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@postgresql.{{ .Values.postgresql.namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: "true"
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres-exporter/queries.yaml"
        livenessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: queries
          mountPath: /etc/postgres-exporter
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: queries
        configMap:
          name: postgres-exporter-queries

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: {{ .Values.postgresql.namespace }}
  labels:
    app: postgres-exporter
    component: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  type: ClusterIP
  ports:
  - port: 9187
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: postgres-exporter
    component: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: {{ .Values.postgresql.namespace }}
  labels:
    app: postgres-exporter
    component: monitoring
data:
  queries.yaml: |
    # Custom queries for PostgreSQL analytics_data table

    pg_analytics_data_total_rows:
      query: "SELECT COUNT(*) as count FROM analytics_data"
      master: true
      metrics:
        - count:
            usage: "GAUGE"
            description: "Total number of rows in analytics_data table"

    pg_analytics_data_rows_by_sensor:
      query: "SELECT sensor_id, COUNT(*) as count FROM analytics_data GROUP BY sensor_id"
      master: true
      metrics:
        - sensor_id:
            usage: "LABEL"
            description: "Sensor ID"
        - count:
            usage: "GAUGE"
            description: "Number of rows per sensor"

    pg_analytics_data_latest_timestamp:
      query: "SELECT sensor_id, EXTRACT(EPOCH FROM MAX(timestamp)) as latest_timestamp FROM analytics_data GROUP BY sensor_id"
      master: true
      metrics:
        - sensor_id:
            usage: "LABEL"
            description: "Sensor ID"
        - latest_timestamp:
            usage: "GAUGE"
            description: "Latest timestamp (Unix epoch) for sensor"

    pg_analytics_data_avg_temperature:
      query: "SELECT sensor_id, AVG(temperature) as avg_temp FROM analytics_data WHERE timestamp > NOW() - INTERVAL '1 hour' GROUP BY sensor_id"
      master: true
      metrics:
        - sensor_id:
            usage: "LABEL"
            description: "Sensor ID"
        - avg_temp:
            usage: "GAUGE"
            description: "Average temperature in last hour"

    pg_analytics_data_avg_humidity:
      query: "SELECT sensor_id, AVG(humidity) as avg_humidity FROM analytics_data WHERE timestamp > NOW() - INTERVAL '1 hour' GROUP BY sensor_id"
      master: true
      metrics:
        - sensor_id:
            usage: "LABEL"
            description: "Sensor ID"
        - avg_humidity:
            usage: "GAUGE"
            description: "Average humidity in last hour"

    pg_database_size:
      query: "SELECT pg_database_size(current_database()) as size_bytes"
      master: true
      metrics:
        - size_bytes:
            usage: "GAUGE"
            description: "Database size in bytes"

    pg_table_size:
      query: "SELECT pg_total_relation_size('analytics_data') as size_bytes"
      master: true
      metrics:
        - size_bytes:
            usage: "GAUGE"
            description: "Table size (including indexes) in bytes"

# Default values for system-cluster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

kafka:
  namespace: messaging
  image:
    repository: apache/kafka
    tag: "4.1.0"
    pullPolicy: IfNotPresent
  controller:
    replicaCount: 2
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
    env:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # Random-ID
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-controller-0.kafka-controller.messaging.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller.messaging.svc.cluster.local:9093"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  broker:
    replicaCount: 2
    resources:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "1000m"
        memory: "2Gi"
    env:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # Random-ID
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-controller-0.kafka-controller.messaging.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller.messaging.svc.cluster.local:9093"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "50"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "1"


fastapi:
  namespace: api
  replicaCount: 1
  image:
    repository: localhost/fastapi
    tag: "latest"
    pullPolicy: Never # Wird beim erstellen direkt ins Cluster gepusht
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  env:
    kafkaBootstrapServers: "kafka.messaging.svc.cluster.local:9092"
    kafkaTopic: "sensor-data"
  ingress:
    enabled: true
    host: "fastapi.local"
    tls:
      enabled: false
      secretName: "fastapi-tls"


spark:
  namespace: data
  replicaCount: 1
  image:
    repository: localhost/spark
    tag: "latest"
    pullPolicy: Never
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"
  env:
    KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-0.kafka-broker.messaging.svc.cluster.local:9092,kafka-broker-1.kafka-broker.messaging.svc.cluster.local:9092"
    SOURCE_TOPIC: "raw-data"
    TARGET_TOPIC: "analytics-data"

postgresql:
  namespace: data
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: sensordata
  env:
    # Secrets sollten in Secrets Manager gespeichert werden nicht im Code
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres-admin-pw"
    POSTGRES_DB: "sensordata"
    PGDATA: "/var/lib/postgresql/data/pgdata"
    APP_USER: "appuser"
    APP_PASSWORD: "appuser-secure-pw"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  storage:
    size: 5Gi
  service:
    type: ClusterIP
    port: 5432

postgresqlConnect:
  namespace: messaging
  replicaCount: 1
  image:
    repository: localhost/postgres-kafka-connector
    tag: "latest"
    pullPolicy: Never
  resources:
    limits:
      cpu: "1000m"
      memory: "3Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  env:
    CONNECT_BOOTSTRAP_SERVERS: "kafka-broker-0.kafka-broker.messaging.svc.cluster.local:9092,kafka-broker-1.kafka-broker.messaging.svc.cluster.local:9092"
    CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
    CONNECT_GROUP_ID: "kafka-connect-group"
    CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
    CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
    CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
    CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
    CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
    CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
    CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
    CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
    CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"

# Prometheus Monitoring Configuration
prometheus:
  namespace: monitoring
  image:
    repository: prom/prometheus
    tag: "v3.7.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  storage:
    size: "10Gi"
  retention: "15d"
  scrapeInterval: "15s"
  evaluationInterval: "15s"
  service:
    type: ClusterIP
    port: 9090

# Grafana Visualization Configuration
grafana:
  namespace: monitoring
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin  # Ändere das in Produktion!
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  storage:
    size: "5Gi"
  service:
    type: ClusterIP
    port: 3000

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# NGINX Ingress Controller Configuration
ingress-nginx:
  enabled: true
  controller:
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false  # Nur wenn Prometheus installiert ist
    admissionWebhooks:
      enabled: false  # Deaktiviert für lokale Entwicklung (vermeidet TLS-Zertifikat-Probleme)
  defaultBackend:
    enabled: true
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 20m
        memory: 32Mi
